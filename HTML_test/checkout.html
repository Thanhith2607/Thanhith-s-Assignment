<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body>

<h1>Checkout Form</h1>

<form onsubmit="return validateForm()">
    
    Name: <input type="text" id="name"><br><br>
    Email: <input type="text" id="email"><br><br>
    Phone: <input type="text" id="phone"><br><br>
    Address: <input type="text" id="address"><br><br>
    City: <input type="text" id="city"><br><br>
    PIN Code: <input type="text" id="pin"><br><br>

    Payment Method:<br>
    <input type="radio" name="payment"> UPI
    <input type="radio" name="payment"> Card
    

    <input type="checkbox" id="terms"> Accept Terms<br><br>

    <input type="submit" value="Place Order">

</form>

</body>
</html>
